[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vortex_torch"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "lighteval[math]==0.12.2",
    # Left to the transformers pin (5.12.1 needs huggingface-hub >=1.5,<2). The
    # old ==0.36.2 pin was compatible with transformers 4.57.1 only and makes the
    # sglang 0.5.16 resolve impossible.
    "huggingface_hub>=1.5,<2",
    "inspect-ai==0.3.207",
    # transformers is pinned by the vendored sglang (0.5.16 -> ==5.12.1); don't
    # re-pin it here or the two resolves conflict. >=5 is what GLM-4.7-Flash
    # (`glm4_moe_lite`) needs, which is why the old vortex_glm env split existed.
    "transformers>=5.0",
    "s3fs==2025.9.0",
    "wonderwords",
    "langdetect",
    "jsonlines",
    "immutabledict",
    "datasets",
    "beautifulsoup4",
    "accelerate",
    "unitxt",
]

[tool.setuptools.packages.find]
include = ["vortex_torch*"]
