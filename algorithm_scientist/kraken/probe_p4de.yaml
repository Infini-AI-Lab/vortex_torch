jobName: zhuominc-vortex-probe-p4de
jobPriority: HIGH
projectName: green
resourceConfig:
  queue: green-hyperpod-p4de.24xlarge-us-west-2-tas
  nodeCount: 1
containers:
  - imageUri: 339713096311.dkr.ecr.ap-south-1.amazonaws.com/agi-training-toolkit-images-gpu-nv4-p6:agi-training-nv4-ebony-2026-02-03T03.40.50Z
    command: bash
    args:
      - -lc
      - |
        echo "===== HOST / GPU ====="
        hostname; nvidia-smi || echo "no nvidia-smi"
        echo "===== DRIVER / CUDA ====="
        nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv || true
        echo "===== OS ====="
        cat /etc/os-release | head -3
        echo "===== PYTHON ====="
        which python python3; python3 -VV
        echo "===== EXISTING TORCH ====="
        python3 -c "import torch;print('torch',torch.__version__,torch.version.cuda)" 2>&1 | head -3
        echo "===== PIP / UV ====="
        which pip uv conda 2>&1
        echo "===== MOUNTS ====="
        df -h | grep -Ev "^(tmpfs|overlay|devtmpfs|shm)" | head -20
        echo "--- candidate shared dirs ---"
        for d in /scratch /checkpoint-fsx /fsx /home /mnt /data /workspace; do
          [ -d "$d" ] && echo "EXISTS $d" && ls "$d" 2>/dev/null | head -5
        done
        echo "===== WRITABLE? ====="
        for d in /scratch /checkpoint-fsx /fsx /tmp; do
          [ -d "$d" ] && (touch "$d/.zhuominc_wtest" 2>/dev/null && echo "WRITABLE $d" && rm -f "$d/.zhuominc_wtest" || echo "readonly  $d")
        done
        echo "===== NETWORK (pypi) ====="
        timeout 60 curl -sS -o /dev/null -w "pypi:%{http_code}\n" https://pypi.org/simple/ || echo "pypi unreachable"
        timeout 60 curl -sS -o /dev/null -w "hf:%{http_code}\n" https://huggingface.co || echo "hf unreachable"
        echo "===== DISK SPACE for env build ====="
        df -h /tmp / | tail -3
        echo "===== PROBE DONE ====="
        sleep 5400
    environmentVariables:
      - name: PYTHONUNBUFFERED
        value: "True"
workloadTaxonomyConfig:
  workloadType: data-gen
  subtype: general
  role: general
  runType: dev
